<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7d2ae8">
  <title>Grafik-Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <!-- Startseite: Format wählen und gespeicherte Designs -->
  <section id="home" class="home" hidden>
    <header class="home-header">
      <div class="brand"><span class="brand-mark"></span>Grafik-Editor</div>
    </header>
    <main class="home-main">
      <h1>Was möchtest du heute gestalten?</h1>
      <div class="format-grid" id="formatGrid"></div>
      <details class="custom-size">
        <summary>Benutzerdefinierte Größe</summary>
        <form id="customSizeForm" class="custom-size-form">
          <label>Breite <input type="number" name="w" min="50" max="5000" value="1080" required> px</label>
          <span>×</span>
          <label>Höhe <input type="number" name="h" min="50" max="5000" value="1080" required> px</label>
          <button class="btn btn-primary" type="submit">Design erstellen</button>
        </form>
      </details>
      <h2>Mit einer Vorlage starten</h2>
      <div class="home-templates" id="homeTemplates"></div>
      <h2 id="designsTitle" hidden>Deine Designs</h2>
      <div class="design-grid" id="designGrid"></div>
    </main>
  </section>

  <!-- Editor -->
  <section id="editor" class="editor" hidden>
    <header class="topbar">
      <button class="icon-btn topbar-btn" id="btnHome" title="Startseite" data-icon="home"></button>
      <input class="design-name" id="designName" value="Unbenanntes Design" aria-label="Designname" spellcheck="false">
      <span class="save-state" id="saveState"></span>
      <div class="topbar-spacer"></div>
      <button class="icon-btn topbar-btn" id="btnUndo" title="Rückgängig (Strg+Z)" data-icon="undo"></button>
      <button class="icon-btn topbar-btn" id="btnRedo" title="Wiederholen (Strg+Y)" data-icon="redo"></button>
      <button class="btn btn-light" id="btnShare" hidden><span data-icon="share"></span><span class="hide-sm">Teilen</span></button>
      <button class="btn btn-light" id="btnDownload"><span data-icon="download"></span><span class="hide-sm">Herunterladen</span></button>
      <button class="btn btn-accent" id="btnDone" hidden><span data-icon="check"></span>Fertig</button>
    </header>

    <div class="editor-body">
      <nav class="rail" id="rail">
        <button class="rail-btn" data-panel="templates"><span data-icon="layout"></span>Vorlagen</button>
        <button class="rail-btn" data-panel="text"><span data-icon="type"></span>Text</button>
        <button class="rail-btn" data-panel="elements"><span data-icon="shapes"></span>Elemente</button>
        <button class="rail-btn" data-panel="uploads"><span data-icon="upload"></span>Uploads</button>
        <button class="rail-btn" data-panel="background"><span data-icon="palette"></span>Hintergrund</button>
        <button class="rail-btn" data-panel="layers"><span data-icon="layers"></span>Ebenen</button>
      </nav>

      <aside class="panel" id="panel" hidden>
        <div class="panel-grip" id="panelGrip"></div>
        <div class="panel-head">
          <h3 id="panelTitle"></h3>
          <button class="icon-btn" id="panelClose" title="Schließen" data-icon="close"></button>
        </div>
        <div class="panel-content" id="panelContent"></div>
      </aside>

      <main class="main">
        <div class="toolbar" id="toolbar"></div>
        <div class="workspace" id="workspace">
          <div class="stage" id="stage">
            <canvas id="canvas"></canvas>
          </div>
        </div>
        <footer class="zoombar">
          <button class="icon-btn" id="zoomOut" title="Verkleinern" data-icon="minus"></button>
          <button class="zoom-value" id="zoomValue" title="An Fenster anpassen">100%</button>
          <button class="icon-btn" id="zoomIn" title="Vergrößern" data-icon="plus"></button>
          <span class="size-info" id="sizeInfo"></span>
        </footer>
      </main>
    </div>
  </section>

  <div class="popover" id="popover" hidden></div>
  <div class="modal-backdrop" id="modal" hidden><div class="modal" id="modalBody"></div></div>
  <div class="toast" id="toast" hidden></div>
  <div class="drop-overlay" id="dropOverlay" hidden><div>Bild hier ablegen</div></div>
  <input type="file" id="fileInput" accept="image/*" multiple hidden>

  <script src="js/vendor/fabric.min.js"></script>
  <script src="js/vendor/jspdf.umd.min.js" defer></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
